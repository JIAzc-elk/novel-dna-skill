name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    name: unittest (py${{ matrix.python }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python: ["3.10", "3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Show python version
        run: python -V

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Smoke test the AIGC scanner
        shell: bash
        run: |
          printf '# 试稿\n\n“账目不对。”他伸手拨了拨算筹，米粮少了三斗二升。\n' > /tmp/smoke.md
          python scripts/check_novel_ai.py /tmp/smoke.md --output /tmp/smoke.json
